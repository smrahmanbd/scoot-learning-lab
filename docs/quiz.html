<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOOT Quiz Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main class="wrap">
  <header class="level-head prose">
    <h1>Quiz bank</h1>
    <p class="lede">All 42 level questions plus 360 group-work questions (six 10-question quizzes for each of the six groups), each with an explanation. Pick a set, or mix everything for exam revision. Your best score per set is remembered in this browser.</p>
  </header>
  <div class="prose">
    <div class="seg" role="group" aria-label="Question set" id="sets" style="margin-top:1.4rem">
      <button type="button" data-s="foundation" aria-pressed="true">Foundation</button>
      <button type="button" data-s="advanced">Advanced</button>
      <button type="button" data-s="mastery">Mastery</button>
      <button type="button" data-s="mixed">Mixed exam (20)</button>
    </div>
    <p class="muted" style="margin:.8rem 0 .3rem;font-size:.95rem">Group work (<a href="groupwork.html">questions</a> · <a href="materials/SCOOT_Group_Quizzes.pdf" download>printable PDF</a>)</p>
    <div class="seg" role="group" aria-label="Group quiz" id="gsets">
      <button type="button" data-s="g1">Group 1 · Small nudges</button>
      <button type="button" data-s="g2">Group 2 · Detectors &amp; LPUs</button>
      <button type="button" data-s="g3">Group 3 · Platoons</button>
      <button type="button" data-s="g4">Group 4 · Queue &amp; DoS</button>
      <button type="button" data-s="g5">Group 5 · Validation</button>
      <button type="button" data-s="g6">Group 6 · SCOOT vs others</button>
    </div>
    <div class="seg" role="group" aria-label="Quiz number" id="qnums" style="margin-top:8px" hidden></div>
    <div class="quiz" id="qz"></div>
  </div>
</main>
<script src="js/quizdata.js"></script>
<script src="js/groupquiz.js"></script>
<script src="js/common.js"></script>
<script>
  const el = document.getElementById('qz');
  let qn = 1;
  function load(s) {
    let qs = s[0] === 'g' ? (GROUPQUIZ[s.slice(1)].quizzes.find(z => z.n === qn) || GROUPQUIZ[s.slice(1)].quizzes[0]).qs : s === 'mixed' ? [...QUIZ.foundation, ...QUIZ.advanced, ...QUIZ.mastery].sort(() => Math.random() - 0.5).slice(0, 20) : QUIZ[s];
    Quiz(el, qs, 'bank-' + s + (s[0] === 'g' ? '_' + qn : ''));
  }
  const all = document.querySelectorAll('#sets button, #gsets button'), nums = document.getElementById('qnums');
  let cur = 'foundation';
  function numbar(s) {
    if (s[0] !== 'g') { nums.hidden = true; return; }
    nums.hidden = false;
    nums.innerHTML = GROUPQUIZ[s.slice(1)].quizzes.map(z => `<button type="button" data-n="${z.n}" aria-pressed="${z.n === qn}">Quiz ${z.n} · ${z.title}</button>`).join('');
    nums.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { qn = +b.dataset.n; numbar(cur); load(cur); }));
  }
  const choose = s => { cur = s; all.forEach(x => x.setAttribute('aria-pressed', x.dataset.s === s)); numbar(s); load(s); };
  all.forEach(b => b.addEventListener('click', () => choose(b.dataset.s)));
  const prm = new URLSearchParams(location.search), want = prm.get('set');
  qn = Math.max(1, Math.min(6, +prm.get('quiz') || 1));
  choose(want && [...all].some(b => b.dataset.s === want) ? want : 'foundation');
</script>
</body>
</html>
